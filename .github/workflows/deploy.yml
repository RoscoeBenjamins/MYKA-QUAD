name: Test & deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: API tests (Code.gs in a fake Apps Script runtime)
        run: node backend/test/api.test.js
      - name: Auto-deploy tests
        run: node backend/test/deploy.test.js

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: source/pnpm-lock.yaml
      - name: Install
        working-directory: source
        run: pnpm install --frozen-lockfile
      - name: Type-check
        working-directory: source
        run: pnpm exec tsc -p tsconfig.app.json --noEmit
      - name: Build single-file app
        working-directory: source
        run: |
          pnpm exec parcel build index.html --dist-dir dist --no-source-maps
          mkdir -p ../_site/api
          pnpm exec html-inline dist/index.html > ../_site/index.html
      - name: Add config and the tested API release
        env:
          MSG: ${{ github.event.head_commit.message }}
        run: |
          cp config.js _site/
          touch _site/.nojekyll
          cp backend/Code.gs _site/api/Code.txt
          cp backend/appsscript.json _site/api/appsscript.json
          node -e "const fs=require('fs');fs.writeFileSync('_site/api/release.json',JSON.stringify({sha:process.env.GITHUB_SHA,tests:'passed',message:(process.env.MSG||'').split('\n')[0],codeLength:fs.readFileSync('backend/Code.gs','utf8').length,builtAt:new Date().toISOString()}))"
          ls -la _site _site/api
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
